[project]
name = "blade-runner"
version = "0.1.0"
description = "Constitutional archaeology of Chinese frontier language models"
license-files = ["LICENSE"]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constitution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=constitution --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"
markers = ["slow: end-to-end smoke tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/constitution"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The instrument is multilingual: CJK full-width punctuation is intentional.
ignore = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "scipy", "scipy.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B007"]
"scripts/*" = ["E501"]
"src/constitution/report.py" = ["E501"]
